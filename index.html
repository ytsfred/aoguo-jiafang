<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>熬过甲方</title><link rel="stylesheet" href="desk.css"></head>
<body><main>
<header><h1>熬过甲方<span aria-hidden="true">.</span></h1><button id="mode" class="switch">夜班挑战 ↗</button></header>
<div class="row subtitle"><b id="level"></b><span id="turn"></span></div>
<div class="stats"><span>我的精力 <strong id="energy"></strong> <b id="delta"></b></span><span id="helpers"></span></div>
<section class="desk"><div class="row"><h2>甲方工单</h2><small>从左到右生效 →</small></div><div id="deck"></div></section>
<p id="log" role="status"></p><div id="result" role="status" hidden></div>
<section id="choices"><div class="row"><h2>我的手牌</h2><small>点一张出牌</small></div><div id="hand"></div></section>
<footer><button id="action"></button><button id="reset">↺ 重开本局</button></footer>
<details><summary>玩法说明</summary><p>每回合可出一张手牌，或留牌跳过。随后甲方最左边的牌生效，每个在场小弟再扣 1 精力。撑到工单清空就赢，精力归零就输。</p><p>夜班挑战会洗牌。用「已读不回」挡下「再改一版」，会连带退回下一张工单。</p></details>
</main><script src="game.js"></script><script src="ui.js"></script></body></html>
