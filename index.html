<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>熬过甲方</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#232f2c;background-color:#eceee7;background-image:radial-gradient(#cbd1c6 1px,transparent 1px);background-size:12px 12px;font:16px/1.5 system-ui,sans-serif}main{max-width:640px;margin:clamp(12px,5vh,48px) auto;padding:clamp(16px,4vw,32px);background:#fffdf6;border:1px solid #9da79c;box-shadow:4px 5px 0 #c7ccbf}header,.row,.stats,footer{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:clamp(32px,7vw,48px);letter-spacing:-2px;margin:0}header{border-bottom:3px solid;padding-bottom:12px}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #2c6ecd;outline-offset:2px}.quiet{background:none;border:0;text-decoration:underline;text-underline-offset:4px;min-height:44px}.stats{background:#203e36;color:#fffdf6;padding:12px 16px;margin:16px 0 8px}.stats strong{font: bold 30px/1 monospace;color:#e6f4b2}.row h2{font-size:20px;margin:0}.row small,small{font-size:13px}.cards{display:grid;gap:7px;grid-template-columns:repeat(auto-fit,minmax(min(100%,90px),1fr));margin:10px 0}.card{border:1px solid #a9aa9b;padding:10px 8px;background:#f4f1e6;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:5px;text-align:left;min-height:98px}.card b{font-size:17px}.card small{line-height:1.4}.next{background:#ffe7cb;border-color:#ad683d}.tag{font:600 12px monospace;color:#78452d}.hand{background:#e4efda;border:1px solid #65816d;box-shadow:0 3px 0 #768575}.hand:active,.action:active{transform:translateY(2px)}.hand b{margin-top:8px}section{margin-top:20px}#log{border-block:1px dashed #a4a99b;padding:10px 0;font-size:14px;color:#47564e}footer{margin-top:18px}.action{background:#203e36;color:white;border:0;padding:12px 24px;font-weight:700}details{margin-top:20px;font-size:14px}summary{cursor:pointer}#result{background:#f5e6c6;padding:12px;font-weight:700}p{margin:10px 0}[hidden]{display:none}@media(max-width:680px){main{margin:10px}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}#deck{display:flex;overflow-x:auto;padding-bottom:4px}#deck .card{flex:0 0 28%}}
</style>
<main><header><h1>熬过甲方</h1><button id="reset" class="quiet">↺ 重开本关</button></header>
<div class="stats"><span>精力　<strong id="energy"></strong></span><span id="helpers"></span></div>
<div class="row"><b id="level"></b><small id="turn"></small></div>
<section><div class="row"><h2>甲方牌</h2><small>从左到右生效 →</small></div><div class="cards" id="deck"></div></section>
<p id="log" aria-live="polite"></p><div id="result" role="status" hidden></div>
<section id="choices"><div class="row"><h2>我的手牌</h2><small>点一张出牌</small></div><div class="cards" id="hand"></div></section>
<footer><button id="action" class="action"></button></footer>
<details><summary>玩法说明</summary><p>每回合可以出一张手牌，也可以不出。用过的手牌会消耗。甲方最左边的牌接着生效，最后每个小弟扣你 1 精力。</p><p>精力归零就输。撑过甲方最后一张牌就过关。</p></details></main>
<script src="game.js"></script><script src="ui.js"></script></html>
